name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + lint + test (coverage gates enforced)
    runs-on: ubuntu-latest
    steps:
      # plugins depends on @smithers/* packages from the sibling agent and
      # flows repos via committed symlinks (.agent-link, .flows-link) that
      # resolve to ../agent/packages and ../flows/packages — check out all
      # three as siblings so npm ci can resolve the file: links.
      - uses: actions/checkout@v4
        with:
          path: plugins
      - uses: actions/checkout@v4
        with:
          repository: smithersai/agent
          path: agent
      - uses: actions/checkout@v4
        with:
          repository: smithersai/flows
          path: flows
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci
        working-directory: plugins
      - name: Typecheck all workspaces
        run: npm run check
        working-directory: plugins
      - name: Lint all workspaces
        run: npm run lint
        working-directory: plugins
      # Package vitest configs with `coverage.enabled: true` compute and
      # enforce their coverage thresholds on every run — a red gate fails CI.
      - name: Test all workspaces
        run: npm test
        working-directory: plugins
